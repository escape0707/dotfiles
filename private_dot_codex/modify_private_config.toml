{{- /* chezmoi:modify-template */ -}}
{{- $isTermux := eq .chezmoi.os "android" -}}
{{- $isLinux := eq .chezmoi.os "linux" -}}
{{- $isWindows := eq .chezmoi.os "windows" -}}
{{- $windowsLocalAppData := "" -}}
{{- $windowsRoamingAppData := "" -}}
{{- if $isWindows -}}
{{-   $windowsLocalAppData = env "LOCALAPPDATA" -}}
{{-   $windowsRoamingAppData = env "APPDATA" -}}
{{- end -}}
{{- $workspacesDir := printf "%s%sworkspaces" .chezmoi.homeDir .chezmoi.pathSeparator -}}
{{- $live := fromToml .chezmoi.stdin -}}
model = {{ get . "codexModel" | default "gpt-5.6-luna" | quote }}
model_reasoning_effort = {{ get . "codexReasoningEffort" | default "max" | quote }}
model_context_window = 872000
model_auto_compact_token_limit = 800000
personality = "pragmatic"
web_search = "live"
{{- if $isTermux }}
sandbox_mode = "danger-full-access"
{{- else }}
sandbox_mode = "workspace-write"
{{- end }}
approvals_reviewer = "user"
check_for_update_on_startup = false
plan_mode_reasoning_effort = "xhigh"
service_tier = "default"

[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[features.multi_agent_v2]
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.penpot]
url = "http://localhost:4401/mcp"

[mcp_servers.penpot.tools.execute_code]
approval_mode = "approve"

[mcp_servers.penpot.tools.export_shape]
approval_mode = "approve"

[mcp_servers.penpot.tools.high_level_overview]
approval_mode = "approve"

[mcp_servers.penpot.tools.import_image]
approval_mode = "approve"

[mcp_servers.penpot.tools.penpot_api_info]
approval_mode = "approve"

[sandbox_workspace_write]
network_access = true
{{- if not $isTermux }}
writable_roots = [
    '{{ .chezmoi.sourceDir }}',
    '{{ $workspacesDir }}{{ .chezmoi.pathSeparator }}agent-relay',
{{- if $isWindows }}
    '{{ $windowsLocalAppData }}\fnm_multishells',
    '{{ $windowsLocalAppData }}\ms-playwright',
    '{{ $windowsLocalAppData }}\pnpm',
    '{{ $windowsLocalAppData }}\pnpm-cache',
    '{{ $windowsLocalAppData }}\uv\cache',
    '{{ $windowsRoamingAppData }}\fnm',
    '{{ $windowsRoamingAppData }}\uv\python',
{{- else if $isLinux }}
    "~/.cache/ccache",
    "~/.cache/chromium",
    "~/.cache/gh",
    "~/.cache/go-build",
    "~/.cache/theme-liquid-docs-nodejs",
    "~/.cache/ms-playwright",
    "~/.cache/pnpm",
    "~/.cache/uv",
    "~/.cache/vite-plus",
    "~/.config/chromium",
    "~/.config/gws",
    "~/.config/vite-plus",
    "~/.local/share/cargo",
    "~/.local/share/pnpm",
    "~/.local/share/uv/python",
    "~/.local/share/vite-plus",
    "~/.local/state/vite-plus",
    "~/.npm/_cacache/tmp",
    "~/.cache/texlive/texmf-var",
    "~/go",
{{- end }}
]
{{- end }}

{{- if $isWindows }}
[windows]
sandbox = "elevated"
{{- end }}

[tui]
whimsy = false
{{- if $isTermux }}
status_line = ["model-with-reasoning", "context-remaining", "weekly-limit"]
{{- else }}
status_line = ["model-with-reasoning", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit", "git-branch", "current-dir"]
{{- end }}
session_picker_view = "comfortable"
auto_recap = false
{{- if $isTermux }}
notification_method = "bel"
{{- end }}
notification_condition = "always"

[tui.model_availability_nux]
gpt-6-astra = 4

[[skills.config]]
path = '{{ .chezmoi.homeDir }}{{ .chezmoi.pathSeparator }}.codex{{ .chezmoi.pathSeparator }}skills{{ .chezmoi.pathSeparator }}.system{{ .chezmoi.pathSeparator }}skill-creator{{ .chezmoi.pathSeparator }}SKILL.md'
enabled = false

[[skills.config]]
path = '{{ .chezmoi.homeDir }}{{ .chezmoi.pathSeparator }}.codex{{ .chezmoi.pathSeparator }}skills{{ .chezmoi.pathSeparator }}.system{{ .chezmoi.pathSeparator }}skill-installer{{ .chezmoi.pathSeparator }}SKILL.md'
enabled = false

[notice]
hide_rate_limit_model_nudge = true

{{ if hasKey $live "projects" -}}
{{ dict "projects" (get $live "projects") | toToml -}}
{{ end -}}
